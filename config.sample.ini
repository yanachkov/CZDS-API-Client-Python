[account]
username = username@example.com
password = your_password

[api]
authentication_url = https://account-api.icann.org
czds_url = https://czds-api.icann.org

[download]
# Directory where downloaded zone files will be saved.
# If the folder does not exist, it will be created automatically.
working_directory = /zone/saved891

# Print progress every X megabytes downloaded.
# Larger value = fewer messages, slightly faster performance.
# Example: 50 means "print update every 50 MB".
progress_report_interval_mb = 50

# Size of each network chunk (in KB) when downloading.
# Larger values mean fewer network calls and faster download on stable networks.
# Recommended values:
#   - Slow/unstable network: 32–64
#   - Normal network: 64 (default)
#   - Fast network: 128–256
chunk_size_kb = 64

# Size of the internal file write buffer (in KB).
# Should usually match chunk_size_kb for best performance.
# Larger values give smoother disk writes, especially on SSDs.
buffer_size_kb = 64

# Download only specific TLDs.
# Use a comma-separated list, e.g. "com,net,org".
# Leaving this field empty downloads ALL approved TLDs.
# Examples:
#   tlds = com,shop     → download only .com and .shop
#   tlds =              → download all approved TLDs
tlds = com,shop

